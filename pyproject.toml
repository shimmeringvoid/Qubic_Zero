[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qubic-zero"
version = "0.1.0"
description = "An AlphaZero-style player for Qubic (4x4x4 tic-tac-toe), trained by self-play and checked against exact search."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rafael Espericueta" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
train = ["torch>=2.0"]
notebooks = ["jupyterlab", "nbconvert", "ipykernel", "matplotlib>=3.7", "pandas>=2.0"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]
