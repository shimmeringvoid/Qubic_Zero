name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: pytest -q

  conda:
    # the conda environment of environment.yml, created and tested on three operating systems
    name: conda on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0} # a login shell, in which the action below has the environment active
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: qubic-zero
          channels: conda-forge # named here as well: left to read environment.yml, the action warns about its `nodefaults` line
          conda-remove-defaults: "true"
      - run: conda list "^(python|numpy|pytorch)$"
      - run: pytest -q
